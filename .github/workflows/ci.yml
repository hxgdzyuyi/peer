name: Verify native Peer
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.95.0, components: rustfmt }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p peer-core --locked
      - run: cargo fmt --all -- --check
  native:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.95.0 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p peer --locked
      - run: scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with: { name: Peer-native-macos, path: target/release/bundle/Peer-native-macos.zip, if-no-files-found: error }

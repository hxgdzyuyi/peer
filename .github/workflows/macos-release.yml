name: Package macOS (Apple Silicon)
on: workflow_dispatch
jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build Apple Silicon app
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npm run bundle
          test "$(lipo -archs target/aarch64-apple-darwin/release/bundle/macos/Peer.app/Contents/MacOS/peer)" = arm64
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: Peer-macOS-arm64
          path: target/aarch64-apple-darwin/release/bundle/macos/*.app

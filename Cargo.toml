[workspace]
members = ["crates/repo-core", "crates/peer-native"]
resolver = "2"
exclude = ["vendor/gpui-component"]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 16

[patch."https://github.com/longbridge/gpui-kit"]
gpui-component = { path = "vendor/gpui-component" }

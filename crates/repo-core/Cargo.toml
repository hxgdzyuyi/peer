[package]
name = "peer-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "sync", "io-util", "time"] }
url = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tempfile = "3"
fs2 = "0.4"
json5 = "0.4"
globset = "0.4"
parking_lot = "0.12"

similar = "2.7"
regex = "1"

[dev-dependencies]
tempfile = "3"
